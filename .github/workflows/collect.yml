name: Collect Lostark Prices
on:
  schedule:
    # 평일 (월~금) - 19시 피크 중심
    - cron: '0 1 * * 1-5'    # KST 10:00
    - cron: '0 7 * * 1-5'    # KST 16:00
    - cron: '0 10 * * 1-5'   # KST 19:00  ← 피크
    - cron: '0 11 * * 1-5'   # KST 20:00  ← 피크
    - cron: '0 13 * * 1-5'   # KST 22:00

    # 주말 (토~일) - 13시 피크 중심
    - cron: '0 1 * * 0,6'    # KST 10:00
    - cron: '0 4 * * 0,6'    # KST 13:00  ← 피크
    - cron: '0 5 * * 0,6'    # KST 14:00  ← 피크
    - cron: '0 10 * * 0,6'   # KST 19:00
    - cron: '0 13 * * 0,6'   # KST 22:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run material collector
        env:
          LOSTARK_API_KEY: ${{ secrets.LOSTARK_API_KEY }}
        run: python collect_materials.py
      - name: Run gem collector
        env:
          LOSTARK_API_KEY: ${{ secrets.LOSTARK_API_KEY }}
        run: python collect_gems.py
      - name: Commit updated DB
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add lostark_prices.db
          git stash
          git pull --rebase origin main
          git stash pop
          git add lostark_prices.db
          git diff --staged --quiet || git commit -m "data: $(date '+%Y-%m-%d %H:%M') KST"
          git push
